name: voice_call_kit_v3_workspace
description: >-
  Native pub-workspace Dart/Flutter monorepo for VoiceCallKit v3 — a
  standards-based resilient calling stack. This root package only anchors
  the workspace; all code lives in packages/ and apps/.
version: 3.0.0-dev.1
publish_to: none

environment:
  sdk: ^3.12.0

# Native pub workspace: root `dart pub get` (or `flutter pub get`)
# resolves every member package below in one shared lockfile.
workspace:
  - packages/adaptive_transport
  - packages/call_core
  - packages/call_signaling_adapter
  - packages/device_link
  - packages/media_webrtc
  - packages/privacy_telemetry
  - packages/security
  - packages/signaling
  - packages/signed_config
  - server/signaling_server
  - integration_test
  - tool/fuzz
