name = "voice-call-relay"
main = "src/worker.js"
compatibility_date = "2026-07-01"

# One Durable Object class holds a session's two peers. Pairing needs a
# single place both requests reach, which a stateless Worker cannot give.
[[durable_objects.bindings]]
name = "RELAY_SESSION"
class_name = "RelaySession"

# One shard of the broadcast archive: either an author's descriptors or a
# hash prefix's objects. Sharding by name means an object is found from its
# own hash, with no index to keep and nothing central to block.
[[durable_objects.bindings]]
name = "BROADCAST_ARCHIVE"
class_name = "BroadcastArchiveObject"

# SQLite-backed Durable Objects are the class available on the free plan;
# the older key-value backend is paid-only.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelaySession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BroadcastArchiveObject"]

# One singleton object holds the give lane's in-memory reassembly, downstream
# queue and probe table — the same shape as the single-process Python
# responder it is ported from. A give exchange lasts seconds, inside a warm
# object's life; no durable storage is used, but the class still needs a
# migration to exist.
[[durable_objects.bindings]]
name = "GIVE_SESSION"
class_name = "GiveSession"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["GiveSession"]
