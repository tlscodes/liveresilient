name: seed_lineage
description: >-
  The seed genealogy shared with the engine project: one root seed plus a
  manifest hash derive every domain and substream seed by BLAKE2b-256. Pure,
  no clock, no OS randomness — so a run reproduces byte-for-byte.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  pointycastle: ^4.0.0

dev_dependencies:
  test: ^1.25.0
