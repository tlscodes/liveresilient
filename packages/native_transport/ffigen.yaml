# Bindings to the shim in packages/pt_transport_darwin/ios/Sources/pt_shim.h.
#
# The header is deliberately self-contained — it includes stdint.h and nothing
# else — so this generation step needs neither the pinned archives nor their
# headers. That is what lets the generated file be committed and used on a
# machine that has no cache at all.
#
# Regenerate, from this directory:
#   dart run ffigen --config ffigen.yaml
#
# The generator is pinned to an exact version in pubspec.yaml, so regenerating
# on another machine must produce a byte-identical file. That is the real
# hand-edit detector; the preamble below is only the cheap one that the plan's
# step-3 grep reads.
name: ShimBindings
description: |-
  Bindings to pt_shim.h. Do not edit by hand — regenerate with ffigen.
output: 'lib/src/generated/shim_bindings.dart'
headers:
  entry-points:
    - '../pt_transport_darwin/ios/Sources/pt_shim.h'
  include-directives:
    - '**pt_shim.h'
functions:
  include:
    - 'pt_shim_.*'
macros:
  include:
    - 'PT_SHIM_ERR_.*'
preamble: |
  // AUTO GENERATED FILE, DO NOT EDIT.
  //
  // Generated by package:ffigen from
  // packages/pt_transport_darwin/ios/Sources/pt_shim.h
  //
  // Regenerate: dart run ffigen --config ffigen.yaml
  // (from packages/native_transport)
  //
  // The generator emits its own ignore line below; naming the same diagnostic
  // twice is itself reported, so this one covers only what that one does not.
  // ignore_for_file: type=lint
