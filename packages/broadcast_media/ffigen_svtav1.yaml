# ffigen config for the SVT-AV1 encoder bindings (the phone-authored video
# letter, 2026-09-21). Headers come from the SAME 4.2.0 clone the vendored
# SvtAv1Enc.xcframework was built from (tools/phase5/native/ios-build), so
# struct layouts match the device binary by construction; the host tests
# open /usr/local/lib/libSvtAv1Enc.dylib, also 4.2.0 — a different version
# would silently mis-read EbSvtAv1EncConfiguration.
name: SvtAv1Bindings
description: >-
  Generated bindings for the SVT-AV1 encoder. Do not edit by hand; re-run
  `dart run ffigen --config ffigen_svtav1.yaml` after an SVT-AV1 bump.
output: lib/src/generated/svtav1_bindings.dart
headers:
  entry-points:
    - ../../tools/phase5/native/ios-build/prefix/include/svt-av1/EbSvtAv1Enc.h
  include-directives:
    - '**svt-av1/**'
compiler-opts:
  - -I../../tools/phase5/native/ios-build/prefix/include/svt-av1
  - -I../../tools/phase5/native/ios-build/prefix/include
functions:
  include:
    - svt_av1_get_version
    - svt_av1_enc_init_handle
    - svt_av1_enc_set_parameter
    - svt_av1_enc_parse_parameter
    - svt_av1_enc_init
    - svt_av1_enc_send_picture
    - svt_av1_enc_get_packet
    - svt_av1_enc_release_out_buffer
    - svt_av1_enc_deinit
    - svt_av1_enc_deinit_handle
macros:
  include:
    - 'EB_BUFFERFLAG_.*'
preamble: |
  // AUTO-GENERATED by ffigen from the pinned SVT-AV1 4.2.0 clone. Do not edit.
  // ignore_for_file: type=lint
