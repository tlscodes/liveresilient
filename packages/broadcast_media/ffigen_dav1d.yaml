# ffigen config for the dav1d decoder bindings (FULL_TEST_PLAN T3, VideoNote
# and Photo rows decode on device). Headers come from the SAME dav1d clone
# the vendored framework was built from (tools/phase5/native/ios-build), so
# struct layouts match the device binary by construction.
name: Dav1dBindings
description: >-
  Generated bindings for dav1d (AV1 decode). Do not edit by hand; re-run
  `dart run ffigen --config ffigen_dav1d.yaml` after a dav1d bump.
output: lib/src/generated/dav1d_bindings.dart
headers:
  entry-points:
    - ../../tools/phase5/native/ios-build/prefix/include/dav1d/dav1d.h
  include-directives:
    - '**dav1d/**'
compiler-opts:
  - -I../../tools/phase5/native/ios-build/prefix/include
functions:
  include:
    - dav1d_version
    - dav1d_default_settings
    - dav1d_open
    - dav1d_send_data
    - dav1d_get_picture
    - dav1d_close
    - dav1d_data_create
    - dav1d_data_unref
    - dav1d_picture_unref
macros:
  include:
    - DAV1D_.*
preamble: |
  // AUTO-GENERATED by ffigen from the pinned dav1d clone. Do not edit.
  // ignore_for_file: type=lint
