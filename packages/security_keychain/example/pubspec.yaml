name: security_keychain_example
description: >-
  Example host app for security_keychain — exists to run the real-Keychain
  integration tests on macOS (integration_test/keychain_store_test.dart).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  security:
    path: ../../security
  security_keychain:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
