name: security_keychain
description: >-
  OS keystore adapter implementing security's KeyMaterialStore over the
  flutter_secure_storage plugin (macOS/iOS Keychain backend).
version: 2.0.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  security:
    path: ../security

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
