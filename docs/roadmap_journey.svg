<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#131c2e"/>
    </linearGradient>
    <linearGradient id="doneRoad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6f4a"/>
      <stop offset="100%" stop-color="#2ea36b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#sky)"/>

  <text x="60" y="62" fill="#eaf2ff" font-size="30" font-weight="700">voice_call_kit_v3 — the road so far</text>
  <text x="60" y="92" fill="#8fa3bf" font-size="16">Driving from an un-runnable scaffold to a live, self-healing call. Every number below was measured, not estimated (2026-07-22).</text>

  <!-- ROAD -->
  <path d="M 90 330 L 1180 330" stroke="#1c2740" stroke-width="96" stroke-linecap="round"/>
  <path d="M 90 330 L 1250 330" stroke="url(#doneRoad)" stroke-width="96" stroke-linecap="round" opacity="0.85"/>
  <path d="M 90 330 L 1180 330" stroke="#0b1220" stroke-width="4" stroke-dasharray="26 22" opacity="0.75"/>


  <!-- MILESTONE STOPS -->
  <!-- stop 1 -->
  <circle cx="180" cy="330" r="22" fill="#2ea36b" filter="url(#glow)"/>
  <text x="180" y="337" text-anchor="middle" fill="#04150c" font-size="18" font-weight="700">✓</text>
  <text x="180" y="252" text-anchor="middle" fill="#eaf2ff" font-size="17" font-weight="600">Foundation</text>
  <text x="180" y="274" text-anchor="middle" fill="#8fa3bf" font-size="14">CI gate + 12 packages</text>
  <text x="180" y="398" text-anchor="middle" fill="#2ea36b" font-size="22" font-weight="700">673</text>
  <text x="180" y="418" text-anchor="middle" fill="#6f819c" font-size="13">tests green</text>

  <!-- stop 2 -->
  <circle cx="400" cy="330" r="22" fill="#2ea36b" filter="url(#glow)"/>
  <text x="400" y="337" text-anchor="middle" fill="#04150c" font-size="18" font-weight="700">✓</text>
  <text x="400" y="252" text-anchor="middle" fill="#eaf2ff" font-size="17" font-weight="600">Real app + fixes</text>
  <text x="400" y="274" text-anchor="middle" fill="#8fa3bf" font-size="14">6 real bugs killed, UI landed</text>
  <text x="400" y="398" text-anchor="middle" fill="#2ea36b" font-size="22" font-weight="700">855</text>
  <text x="400" y="418" text-anchor="middle" fill="#6f819c" font-size="13">+27% vs foundation</text>

  <!-- stop 3 -->
  <circle cx="620" cy="330" r="22" fill="#2ea36b" filter="url(#glow)"/>
  <text x="620" y="337" text-anchor="middle" fill="#04150c" font-size="18" font-weight="700">✓</text>
  <text x="620" y="252" text-anchor="middle" fill="#eaf2ff" font-size="17" font-weight="600">Captions + chat/UX</text>
  <text x="620" y="274" text-anchor="middle" fill="#8fa3bf" font-size="14">live_captions, main.dart split</text>
  <text x="620" y="398" text-anchor="middle" fill="#2ea36b" font-size="22" font-weight="700">943</text>
  <text x="620" y="418" text-anchor="middle" fill="#6f819c" font-size="13">+10%</text>

  <!-- stop 4 -->
  <circle cx="840" cy="330" r="22" fill="#2ea36b" filter="url(#glow)"/>
  <text x="840" y="337" text-anchor="middle" fill="#04150c" font-size="18" font-weight="700">✓</text>
  <text x="840" y="252" text-anchor="middle" fill="#eaf2ff" font-size="17" font-weight="600">PHASE 1 + 2a</text>
  <text x="840" y="274" text-anchor="middle" fill="#8fa3bf" font-size="14">path continuity + soak</text>
  <text x="840" y="398" text-anchor="middle" fill="#2ea36b" font-size="22" font-weight="700">945</text>
  <text x="840" y="418" text-anchor="middle" fill="#6f819c" font-size="13">breaker bug found by soak</text>

  <!-- CAR — crossed the finish line -->
  <g transform="translate(1245,330)">
    <ellipse cx="0" cy="34" rx="52" ry="9" fill="#000" opacity="0.35"/>
    <rect x="-46" y="-16" width="92" height="34" rx="12" fill="#4f9cf9"/>
    <path d="M -30 -16 L -18 -36 L 20 -36 L 32 -16 Z" fill="#8ec4ff"/>
    <circle cx="-26" cy="20" r="11" fill="#0b1220" stroke="#8fa3bf" stroke-width="3"/>
    <circle cx="26" cy="20" r="11" fill="#0b1220" stroke="#8fa3bf" stroke-width="3"/>
    <text x="0" y="-52" text-anchor="middle" fill="#2ee38a" font-size="16" font-weight="700">ARRIVED 🏁</text>
    <text x="0" y="66" text-anchor="middle" fill="#eaf2ff" font-size="20" font-weight="700">946 green · 0 red</text>
    <text x="0" y="86" text-anchor="middle" fill="#6f819c" font-size="13">17 test dirs · analyze clean</text>
  </g>

  <!-- stop 5 - the former roadblock, now cleared -->
  <circle cx="1060" cy="330" r="22" fill="#2ea36b" filter="url(#glow)"/>
  <text x="1060" y="337" text-anchor="middle" fill="#04150c" font-size="18" font-weight="700">&#10003;</text>
  <text x="1060" y="252" text-anchor="middle" fill="#eaf2ff" font-size="17" font-weight="600">PHASE 2b</text>
  <text x="1060" y="274" text-anchor="middle" fill="#8fa3bf" font-size="14">sealed CallState</text>
  <text x="1060" y="398" text-anchor="middle" fill="#2ea36b" font-size="22" font-weight="700">946</text>
  <text x="1060" y="418" text-anchor="middle" fill="#6f819c" font-size="13">exhaustive by the compiler</text>

  <!-- FINISH -->
  <g transform="translate(1250,330)">
    <rect x="-2" y="-60" width="6" height="120" fill="#8fa3bf"/>
    <g>
      <rect x="4" y="-60" width="16" height="16" fill="#eaf2ff"/><rect x="20" y="-44" width="16" height="16" fill="#eaf2ff"/>
      <rect x="4" y="-28" width="16" height="16" fill="#eaf2ff"/><rect x="20" y="-60" width="16" height="16" fill="#1c2740"/>
      <rect x="4" y="-44" width="16" height="16" fill="#1c2740"/><rect x="20" y="-28" width="16" height="16" fill="#1c2740"/>
    </g>
    <text x="16" y="98" text-anchor="middle" fill="#eaf2ff" font-size="15" font-weight="600">Ship</text>
  </g>

  <!-- PROGRESS PANEL -->
  <text x="90" y="540" fill="#eaf2ff" font-size="21" font-weight="700">Where each lane stands</text>

  <g transform="translate(90,570)">
    <!-- row template -->
    <g>
      <text x="0" y="26" fill="#c7d5ea" font-size="15">Call core &amp; recovery</text>
      <rect x="250" y="12" width="620" height="18" rx="9" fill="#1c2740"/>
      <rect x="250" y="12" width="620" height="18" rx="9" fill="#2ea36b"/>
      <text x="890" y="27" fill="#2ea36b" font-size="15" font-weight="700">100%</text>
      <text x="960" y="27" fill="#6f819c" font-size="14">127 tests · soak-proven</text>
    </g>
    <g transform="translate(0,44)">
      <text x="0" y="26" fill="#c7d5ea" font-size="15">Transport &amp; path health</text>
      <rect x="250" y="12" width="620" height="18" rx="9" fill="#1c2740"/>
      <rect x="250" y="12" width="620" height="18" rx="9" fill="#2ea36b"/>
      <text x="890" y="27" fill="#2ea36b" font-size="15" font-weight="700">100%</text>
      <text x="960" y="27" fill="#6f819c" font-size="14">114 tests · breaker fixed</text>
    </g>
    <g transform="translate(0,88)">
      <text x="0" y="26" fill="#c7d5ea" font-size="15">Media &amp; adaptation</text>
      <rect x="250" y="12" width="620" height="18" rx="9" fill="#1c2740"/>
      <rect x="250" y="12" width="620" height="18" rx="9" fill="#2ea36b"/>
      <text x="890" y="27" fill="#2ea36b" font-size="15" font-weight="700">100%</text>
      <text x="960" y="27" fill="#6f819c" font-size="14">103 tests · ladder wired live</text>
    </g>
    <g transform="translate(0,132)">
      <text x="0" y="26" fill="#c7d5ea" font-size="15">Signaling &amp; config</text>
      <rect x="250" y="12" width="620" height="18" rx="9" fill="#1c2740"/>
      <rect x="250" y="12" width="620" height="18" rx="9" fill="#2ea36b"/>
      <text x="890" y="27" fill="#2ea36b" font-size="15" font-weight="700">100%</text>
      <text x="960" y="27" fill="#6f819c" font-size="14">289 tests</text>
    </g>
    <g transform="translate(0,176)">
      <text x="0" y="26" fill="#c7d5ea" font-size="15">Security &amp; device link</text>
      <rect x="250" y="12" width="620" height="18" rx="9" fill="#1c2740"/>
      <rect x="250" y="12" width="620" height="18" rx="9" fill="#2ea36b"/>
      <text x="890" y="27" fill="#2ea36b" font-size="15" font-weight="700">100%</text>
      <text x="960" y="27" fill="#6f819c" font-size="14">170 tests</text>
    </g>
    <g transform="translate(0,220)">
      <text x="0" y="26" fill="#c7d5ea" font-size="15">App, chat &amp; captions</text>
      <rect x="250" y="12" width="620" height="18" rx="9" fill="#1c2740"/>
      <rect x="250" y="12" width="620" height="18" rx="9" fill="#2ea36b"/>
      <text x="890" y="27" fill="#2ea36b" font-size="15" font-weight="700">100%</text>
      <text x="960" y="27" fill="#6f819c" font-size="14">86 tests · real M3 UI</text>
    </g>
    <g transform="translate(0,264)">
      <text x="0" y="26" fill="#c7d5ea" font-size="15">CallState → sealed types</text>
      <rect x="250" y="12" width="620" height="18" rx="9" fill="#1c2740"/>
      <rect x="250" y="12" width="620" height="18" rx="9" fill="#2ea36b"/>
      <text x="890" y="27" fill="#2ea36b" font-size="15" font-weight="700">100%</text>
      <text x="960" y="27" fill="#6f819c" font-size="14">every lane paved</text>
    </g>
  </g>

  <text x="90" y="878" fill="#6f819c" font-size="13">Growth 673 → 946 green tests (+41%). Gate now runs the whole workspace, so nothing hides outside a glob. Real-device and cloud-deploy numbers are NOT claimed here — simulated/fake-time only.</text>
</svg>
