name: voice_call_kit_v2

packages:
  - packages/*
  - apps/*

scripts:
  analyze:
    run: dart analyze .
    exec:
      concurrency: 4
    description: Static analysis across every workspace package.
  test:
    run: dart test
    exec:
      concurrency: 4
    description: Unit tests across every workspace package.
  guard:
    run: dart run tool/architecture_guard.dart
    description: >-
      Architecture guard — fails when any excluded legacy transport
      component appears in lib/, platform folders, or pubspecs. Runs in CI
      on every merge.
