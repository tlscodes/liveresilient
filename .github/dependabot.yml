# Pinned SHAs do not update themselves — that is the trade for immutability.
# Dependabot proposes the new SHA when an action releases, so the pin stays
# current without anyone re-resolving tags by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
