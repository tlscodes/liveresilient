name: Desktop

# Linux and Windows desktop builds cannot run on the macOS development host —
# `flutter build linux` and `flutter build windows` refuse with
# "only supported on <OS> hosts". So they are built here, on their own runners,
# and that is the only place those two platforms are ever proven.
on:
  push:
    branches: [main, master, 'phase-*/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same value ci.yml pins; keep the two in lockstep.
  FLUTTER_VERSION: '3.44.6'

jobs:
  linux:
    name: Linux — release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Flutter (pinned, cached)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The Linux desktop embedder links against GTK and its build uses ninja;
      # a bare runner has neither, and the failure is a confusing CMake error
      # rather than a missing-package one.
      - name: Desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Enable the Linux desktop target
        run: flutter config --enable-linux-desktop

      # The platform folder is generated rather than committed: it is created
      # on whichever host can actually build it, so the macOS working tree
      # never carries a directory nobody there can compile.
      - name: Create the linux/ platform folder
        working-directory: apps/reference_app
        run: flutter create --platforms=linux .

      - name: Build
        working-directory: apps/reference_app
        run: flutter build linux --release

      - name: Upload the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-release-bundle
          path: apps/reference_app/build/linux/*/release/bundle
          if-no-files-found: error

  windows:
    name: Windows — release bundle
    runs-on: windows-latest
    # Runs on every push again — public repositories get standard runners for
    # free, so the one-day cost gate of 2026-09-01 no longer applies.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Flutter (pinned, cached)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable the Windows desktop target
        run: flutter config --enable-windows-desktop

      - name: Create the windows/ platform folder
        working-directory: apps/reference_app
        run: flutter create --platforms=windows .

      - name: Build
        working-directory: apps/reference_app
        run: flutter build windows --release

      - name: Upload the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-release-bundle
          path: apps/reference_app/build/windows/*/runner/Release
          if-no-files-found: error

  # Neither desktop platform has a native transport core: no .so or .dll is
  # cross-built for them, so both run the pure-Dart lanes. Saying so here keeps
  # a green desktop build from being read as "the native path works there".
  note:
    name: Native core — not present on desktop
    runs-on: ubuntu-latest
    needs: [linux, windows]
    steps:
      - name: State the limitation
        run: |
          echo "## Desktop builds carry no native transport core" >> "$GITHUB_STEP_SUMMARY"
          echo "- engine/pt builds .dylib/.so for Apple and Android only." >> "$GITHUB_STEP_SUMMARY"
          echo "- Linux would need a version-script build on a Linux host; Windows needs a .def-based recipe and a Windows OpenSSL." >> "$GITHUB_STEP_SUMMARY"
          echo "- Until then isNativeTransportAvailable is false on both, and the app uses the pure-Dart lanes." >> "$GITHUB_STEP_SUMMARY"
