name: CI

# The mechanical gate every sandwich wave passes through (EXECUTION_PLAYBOOK §1).
# Layered: gate (format/analyze/test/guard) ∥ hygiene (secrets) ∥ deps (OSV scan).
# Reproducible: Flutter is version-pinned to match the local toolchain.

on:
  push:
    branches: [main, master, 'phase-*/**']
  pull_request:
  workflow_dispatch:

# Never run two CI rounds on the same ref; newest wins.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.6'   # keep in lockstep with the local SDK (Dart 3.12.2)

jobs:
  gate:
    name: Gate — format · analyze · test · guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (pinned, cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Resolve workspace (native pub workspace)
        run: flutter pub get

      # ── Phase-1 exit gate mirrored as CI ────────────────────────────
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis (infos are fatal)
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Tests with coverage (every package that has a test/ dir)
        run: |
          set -e
          # The glob must cover EVERY testable directory, not just packages/
          # and apps/. A suite outside this list is a suite the gate cannot
          # fail on: the loopback soak in integration_test/ sat red while CI
          # reported green, because the old glob never reached it.
          found=0
          for d in packages/*/ apps/*/ server/*/ integration_test/ tool/*/; do
            [ -d "${d}test" ] || continue
            # Flutter-SDK packages must use `flutter test`; `dart test` cannot
            # resolve flutter_test and fails with "Could not find package test".
            # Machine-readable results alongside the human output: an
            # auditor needs a file to check, not a scrollback. --file-reporter
            # writes JSON while the console reporter still streams.
            name="$(echo "$d" | tr -d '/' | tr '.' '_')"
            report="$PWD/test-reports/${name}.json"
            mkdir -p "$PWD/test-reports"
            if grep -q 'sdk: flutter' "${d}pubspec.yaml" 2>/dev/null; then
              echo "== testing ${d} (flutter)"
              (cd "$d" && flutter test --coverage \
                 --file-reporter="json:${report}")
            else
              echo "== testing ${d} (dart)"
              (cd "$d" && dart test --coverage=coverage \
                 --file-reporter="json:${report}")
            fi
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "No test/ directories found — that is itself a gate failure."
            exit 1
          fi

      # Coverage arrives as per-package LCOV; auditors want one file, so
      # the pieces are concatenated with each package's paths prefixed
      # back to repo-root, which is what LCOV consumers expect.
      - name: Merge coverage into one LCOV report
        if: always()
        run: |
          set -e
          mkdir -p test-reports
          out="test-reports/lcov.info"
          : > "$out"
          for f in packages/*/coverage/lcov.info apps/*/coverage/lcov.info \
                   server/*/coverage/lcov.info; do
            [ -f "$f" ] || continue
            pkg="$(dirname "$(dirname "$f")")"
            # SF: lines are package-relative; rewrite to repo-relative.
            sed "s|^SF:|SF:${pkg}/|" "$f" >> "$out"
          done
          lines="$(grep -c '^SF:' "$out" || true)"
          echo "merged coverage for ${lines} source file(s)"
          if [ "$lines" = "0" ]; then
            echo "::error::coverage report is empty"; exit 1
          fi

      - name: Upload test results and coverage (audit artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: |
            test-reports/
            packages/*/coverage/
            apps/*/coverage/
            server/*/coverage/
          if-no-files-found: error
          retention-days: 90

      - name: Architecture guard
        run: dart run tool/architecture_guard.dart

      # A green suite says a gate's TESTS pass. It says nothing about whether
      # the gate the plan declares has a test at all, because that link lives
      # only in a test's name. Measured 2026-08-17: 11 of 40 declared gates
      # were traceable, so the ledger's status could be remembered but not
      # recomputed. This step rebuilds the table from the repository and fails
      # when a declared gate has no proof — the permanent half of the fix, the
      # renaming being the one-time half.
      #
      # It prints the "no proof found" row even when that row is zero: the
      # absence of a section is indistinguishable from a broken tool.
      # Runs through tools/gate_ratchet.py, which applies the backlog in
      # docs/gate_backlog.json. The logic lives in label_gates.py and does not
      # change; the list of unproven gates changes whenever one closes, so it is
      # data with one authority rather than a recurring edit to the checker.
      - name: Gate traceability (every declared gate reaches a test)
        run: python3 tools/gate_ratchet.py

      # The step above fails on CHANGE, not on the standing backlog: 15 gates
      # are unproven and each is listed with a reason and the slot that closes
      # it. That design has two failure directions — a new gap, and a listed
      # gate that has quietly acquired a proof — and a guard only ever seen
      # passing proves neither. This drives both.
      - name: Gate ratchet fails on a new gap and on a stale entry
        run: python3 tools/test_gate_ratchet.py

      # The ledger claims each wave closed with its verifier output in the
      # same row. A row without a command in it is a claim without evidence,
      # which is the failure mode this project spent the most effort on.
      - name: Ledger rows carry their verifier output
        run: |
          rows=$(grep -cE '^### موج|^### wave' docs/PLAN_five_tickets_v4.md || true)
          proofs=$(grep -cE 'All tests passed|No issues found' docs/PLAN_five_tickets_v4.md || true)
          echo "ledger rows: $rows   rows citing a command result: $proofs"
          if [ "$rows" -gt 0 ] && [ "$proofs" -lt "$rows" ]; then
            echo "::error::a ledger row claims a wave closed without quoting the command that proved it"
            exit 1
          fi

      # A verification command whose output is piped into head/tail, or captured
      # only into a shell variable, destroys the evidence it just produced. That
      # is not hypothetical here: a `signed_config` test failed once in five
      # runs and its NAME was lost to a `tail -1`, so the failure was seen and
      # could not be investigated. The audit runs in under a second and needs no
      # SDK, so it guards every future script rather than the two that were
      # repaired by hand.
      - name: Verification evidence survives its run (no truncating commands)
        run: bash tools/run_suites.sh --check-only

      - name: Gate summary
        if: always()
        run: |
          {
            echo "## CI gate — ${{ job.status }}"
            echo "- Flutter ${{ env.FLUTTER_VERSION }} (pinned)"
            echo "- format · analyze(--fatal-infos) · test · architecture_guard"
            echo "- artifacts: per-package JSON test results + merged lcov.info (90d)"
          } >> "$GITHUB_STEP_SUMMARY"

  hygiene:
    name: Hygiene — secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (block obvious secrets)
        run: |
          if grep -rInE '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|-----BEGIN PRIVATE KEY-----|xox[bpors]-[0-9A-Za-z-]{10,}|ghp_[0-9A-Za-z]{36}|sk-[A-Za-z0-9]{20,})' \
             --include='*.dart' --include='*.yaml' --include='*.json' --include='*.md' \
             --exclude-dir=.git --exclude-dir=.dart_tool --exclude-dir=.backups . ; then
            echo "::error::possible secret committed"; exit 1
          fi
          echo "no obvious secrets found"

  # A green test suite says nothing about what got packaged: on 2026-08-01 the
  # macOS core shipped linked against /usr/local/opt/openssl@3, a path that
  # exists on no user's device, and every test passed. So the Apple bundles are
  # built and then inspected. macOS runners only — otool/nm/lipo are Darwin tools.
  packaging:
    name: Packaging — embedded native framework
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (pinned, cached)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: apps/reference_app/pubspec.yaml
          cache: true

      - name: Build the macOS release bundle
        working-directory: apps/reference_app
        run: flutter build macos --release

      # The gate itself: no build-machine paths in the embedded framework, the
      # exported-symbol count unchanged, and the macOS bundle versioned rather
      # than shallow. It reports SKIP (exit 0) if the framework is absent
      # because the engine artifacts were not available to this checkout — a
      # skip is not a pass, and the summary says so.
      # The Android APK carries the core too, and AGP strips it. The gate checks
      # that the 12 exported symbols survive that strip — .dynsym is what dlopen
      # uses, and stripping is not supposed to touch it, so this proves it.
      - name: Build the Android release APK
        working-directory: apps/reference_app
        run: flutter build apk --release
        continue-on-error: true

      - name: Inspect what was packaged
        run: bash tools/check_embedded_framework.sh

  relay:
    name: Border relay — worker bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Catches a syntax error without needing wrangler at all, so a broken
      # worker fails fast and for an obvious reason.
      - name: Parse check
        run: |
          for f in tools/cloudflare_relay_worker/src/*.js; do
            node --check "$f"
          done

      # The broadcast archive's storage rules — write-once, hash-checked
      # names, retention, rate limits — are pure logic behind an injected
      # storage seam, so they run under the built-in test runner with no
      # dependencies and no workerd.
      - name: Worker unit tests
        working-directory: tools/cloudflare_relay_worker
        run: node --test

      # The offline verifier page is the only thing in this repository a
      # stranger is asked to trust without running the app, so it is gated
      # against the same conformance vectors the client is — and checked
      # for any network call at all, since a verifier that quietly fetched
      # anything would leak who is checking what.
      - name: Web verifier tests
        working-directory: tools/web_verifier
        run: node --test

      # The real gate: wrangler builds the bundle and validates
      # wrangler.toml (bindings, migrations, compatibility date) exactly as
      # a deploy would. --dry-run needs no Cloudflare credentials, so a
      # fork's pull request runs it too.
      - name: Build the worker (dry-run deploy)
        working-directory: tools/cloudflare_relay_worker
        run: npx --yes wrangler@latest deploy --dry-run --outdir=dist

      - name: Relay summary
        if: always()
        run: |
          {
            echo "## Border relay — ${{ job.status }}"
            echo "- node --check on every worker source file"
            echo "- node --test (broadcast archive storage rules)"
            echo "- wrangler deploy --dry-run (bundle + wrangler.toml)"
          } >> "$GITHUB_STEP_SUMMARY"

  deps:
    name: Dependency audit — OSV
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter (pinned, cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Generate lockfile
        run: flutter pub get
      - name: OSV vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: --lockfile=pubspec.lock
        continue-on-error: false

  leak-gate:
    # Option (a): the engine repo is NOT checked out by this CI, so the gate's
    # honest state here is NOT RUN (exit 3) — surfaced as a warning annotation
    # and a loud step summary, never silently green, never blocking merges.
    name: Leak gate — on-wire trace regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run leak gate
        run: |
          set +e
          bash tools/leak_gate.sh | tee /tmp/leak_gate.log
          code=${PIPESTATUS[0]}
          set -e
          case "$code" in
            0)
              {
                echo "## Leak gate — PASS"
                grep -E 'kl|threshold' /tmp/leak_gate.log | head -5 || true
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            3)
              echo "::warning title=Leak gate NOT RUN::engine repo is not available in this CI (LEAK_GATE_ENGINE_DIR unset); the gate did not execute."
              {
                echo "## Leak gate — NOT RUN (engine repo not checked out)"
                echo "- \`tools/leak_gate.sh\` exited 3: the trace-gate evaluator lives in a separate repo not available to this workflow."
                echo "- This is NOT a pass. Run locally:"
                echo '  `LEAK_GATE_ENGINE_DIR=<engine checkout> bash tools/leak_gate.sh`'
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              {
                echo "## Leak gate — FAIL (exit $code)"
                tail -20 /tmp/leak_gate.log
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$code"
              ;;
          esac
