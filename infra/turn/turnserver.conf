# =============================================================================
# LOCAL DEV ONLY — DO NOT USE THIS CONFIG IN PRODUCTION.
#
# Static long-term credentials (lt-cred-mech, user dev:devpass) below are
# convenient for local loopback testing but MUST NOT be reused anywhere
# reachable from the internet. Production path (blueprint Phase 6,
# UPGRADE_BLUEPRINT_V3.md ~line 900 and line 1208) is:
#   - short-lived credentials via use-auth-secret (HMAC time-limited turn
#     username/password minted per-call by the signaling server), NOT a
#     fixed user:pass pair;
#   - TURN over UDP, TCP, AND TLS (TURNS) — this file runs plain UDP/TCP only;
#   - the TURN cost pre-gate (UPGRADE_BLUEPRINT_V3.md line 817) before any
#     cloud/region deployment — loopback has zero egress cost so that gate
#     does not apply to this dev setup.
# =============================================================================

listening-port=3478
# No listening-tls-port here: TLS TURN (TURNS) is Phase 6 production work.

# Relay allocation range — keep in sync with docker-compose.yml port publish.
min-port=49160
max-port=49200

# --- auth: LOCAL DEV static credentials, see header ---
lt-cred-mech
user=dev:devpass
realm=local.dev

# Advertise relay candidates as loopback/local — this container is not meant
# to be reachable from outside the dev machine.
listening-ip=0.0.0.0
relay-ip=0.0.0.0

fingerprint

# Basic abuse guards even for local dev, cheap to keep on.
total-quota=100
user-quota=10

# Log to stdout so `docker logs` shows listener bring-up and allocations.
log-file=stdout
verbose
no-cli
